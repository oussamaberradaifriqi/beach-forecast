<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach & Swim Conditions Finder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Beach Vibes Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Nunito', 'sans-serif'],
                        'beach': ['Pacifico', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(180deg, #60A5FA 0%, #BAE6FD 50%, #E0F2FE 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* --- SUN & BACKGROUND --- */
        .sun {
            position: fixed;
            top: 5%;
            right: 10%;
            width: 100px;
            height: 100px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 60px #FFD700, 0 0 100px #FF8C00;
            animation: pulseSun 4s infinite alternate;
            z-index: -2;
        }
        @keyframes pulseSun {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .scenery-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: -1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .waves {
            position: relative;
            width: 100%;
            height: 12vh;
            margin-bottom: -7px; 
            min-height: 80px;
            max-height: 120px;
        }

        .sand {
            height: 10vh;
            width: 100%;
            background: linear-gradient(to bottom, #fde08b, #d4a373);
            position: relative;
        }
        .sand::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 10px 10px;
            opacity: 0.5;
        }

        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: var(--wave-speed-1, 7s); }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: var(--wave-speed-2, 10s); }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: var(--wave-speed-3, 13s); }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: var(--wave-speed-4, 20s); }

        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }

        /* --- UI ELEMENTS --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.1);
            border-radius: 1.25rem;
            transition: transform 0.2s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.9);
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .hidden { display: none !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            border: 4px solid rgba(255,255,255,0.5);
            border-top: 4px solid #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.4); border-radius: 10px; }
        
        /* Hide scrollbar for date tabs but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div class="sun"></div>

    <div class="scenery-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(56, 189, 248, 0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(14, 165, 233, 0.7)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#0284c7" />
            </g>
        </svg>
        <div class="sand"></div>
    </div>

    <!-- VIEW 1: SEARCH SCREEN -->
    <div id="search-view" class="flex flex-col items-center justify-center min-h-screen p-6 transition-opacity duration-500 relative z-10 pb-20">
        <div class="text-center mb-6">
            <h1 class="font-beach text-6xl md:text-7xl text-sky-900 mb-1 drop-shadow-md tracking-wide">Beach Vibes</h1>
            <p class="text-sky-800 text-lg md:text-xl font-bold mb-6 drop-shadow-sm">Find your perfect wave 🌊</p>
        </div>

        <div class="relative w-full max-w-xl z-50">
            <div class="relative flex items-center group">
                <div class="absolute left-6 text-amber-500 transition-transform group-focus-within:scale-110 group-focus-within:rotate-12">
                    <i data-lucide="map" class="w-6 h-6"></i>
                </div>
                <input 
                    type="text" id="search-input" 
                    class="w-full pl-14 pr-6 py-4 glass-panel text-lg font-bold focus:outline-none focus:ring-4 focus:ring-amber-400/50 placeholder-sky-700/60 text-sky-900 transition-all"
                    placeholder="Search a beach city (e.g. Honolulu)..." autocomplete="off"
                >
            </div>
            
            <div id="search-results" class="absolute w-full mt-2 glass-panel overflow-hidden hidden max-h-64 overflow-y-auto z-50 shadow-xl"></div>
        </div>

        <!-- Favorites Section -->
        <div id="favorites-section" class="w-full max-w-xl mt-8 hidden fade-in">
            <div class="flex items-center text-sky-900 font-bold mb-3 px-2">
                <i data-lucide="heart" class="w-5 h-5 mr-2 text-rose-500 fill-rose-500"></i> Saved Beaches
            </div>
            <div id="favorites-container" class="flex flex-wrap gap-3">
                <!-- Favorites injected here -->
            </div>
        </div>
    </div>

    <!-- VIEW 2: DETAILS SCREEN -->
    <div id="details-view" class="hidden min-h-screen p-4 md:p-8 flex-col items-center relative z-10 pb-24">
        <div class="w-full max-w-5xl">
            <!-- Navigation -->
            <button id="back-btn" class="flex items-center text-sky-900 hover:text-amber-600 font-bold mb-6 transition-colors group bg-white/50 hover:bg-white/80 px-4 py-2 rounded-full backdrop-blur-md border-2 border-white/60 shadow-md text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1.5 transform group-hover:-translate-x-1 transition-transform"></i>
                Back to Map
            </button>

            <!-- States -->
            <div id="loading-state" class="hidden flex-col items-center justify-center py-20 glass-panel">
                <div class="loader mb-4"></div>
                <p class="text-sky-900 font-bold animate-pulse">Catching the latest waves...</p>
            </div>

            <div id="error-state" class="hidden glass-panel p-8 text-center max-w-xl mx-auto mt-6">
                <div class="text-5xl mb-3">🌵</div>
                <h2 class="font-beach text-3xl text-amber-800 mb-2">No Ocean Here!</h2>
                <p id="error-message" class="text-sky-900 font-semibold">This location appears to be inland.</p>
            </div>

            <!-- Content -->
            <div id="content-state" class="hidden fade-in">
                
                <!-- Header with Favorite Toggle -->
                <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4 glass-panel p-6">
                    <div class="flex items-center justify-center md:justify-start gap-4">
                        <div class="text-center md:text-left">
                            <h2 id="city-name" class="font-beach text-4xl md:text-5xl text-sky-900 drop-shadow-sm">City</h2>
                            <div class="flex items-center justify-center md:justify-start text-sky-700 font-bold mt-1">
                                <i data-lucide="map-pin" class="w-4 h-4 mr-1 text-amber-500"></i>
                                <span id="city-country">Country</span>
                            </div>
                        </div>
                        <button id="toggle-favorite-btn" class="p-2 rounded-full bg-white/40 hover:bg-white/80 transition shadow-sm border border-white">
                            <i data-lucide="heart" id="fav-icon" class="w-7 h-7 text-rose-500 transition-colors"></i>
                        </button>
                    </div>
                </div>

                <!-- Suitability Banner -->
                <div id="suitability-banner" class="glass-panel p-6 mb-6 flex items-center flex-col sm:flex-row gap-5 transition-all duration-500 border-[3px]">
                    <div id="suitability-icon" class="text-5xl shrink-0 drop-shadow-md hover:scale-110 transition-transform"></div>
                    <div class="text-center sm:text-left">
                        <h3 id="suitability-title" class="font-beach text-3xl mb-1 tracking-wide"></h3>
                        <p id="suitability-reason" class="text-lg font-semibold"></p>
                    </div>
                </div>

                <!-- Current Data Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="glass-card p-4 flex flex-col items-center text-center">
                        <div class="text-3xl mb-1">🌡️</div>
                        <p class="text-xs text-sky-700 font-black uppercase tracking-wider mb-0.5">Water</p>
                        <p id="val-water-temp" class="font-beach text-2xl text-sky-900">--°C</p>
                    </div>
                    <div class="glass-card p-4 flex flex-col items-center text-center">
                        <div class="text-3xl mb-1">🌊</div>
                        <p class="text-xs text-sky-700 font-black uppercase tracking-wider mb-0.5">Waves</p>
                        <p id="val-waves" class="font-beach text-2xl text-sky-900">-- m</p>
                    </div>
                    <div class="glass-card p-4 flex flex-col items-center text-center">
                        <div class="text-3xl mb-1">☀️</div>
                        <p class="text-xs text-sky-700 font-black uppercase tracking-wider mb-0.5">Air Temp</p>
                        <p id="val-air-temp" class="font-beach text-2xl text-sky-900">--°C</p>
                    </div>
                    <div class="glass-card p-4 flex flex-col items-center text-center">
                        <div class="text-3xl mb-1">💨</div>
                        <p class="text-xs text-sky-700 font-black uppercase tracking-wider mb-0.5">Wind</p>
                        <p id="val-wind" class="font-beach text-2xl text-sky-900">-- km/h</p>
                    </div>
                </div>

                <!-- 7-Day Forecast Section -->
                <div id="forecast-section" class="w-full mt-8 fade-in hidden glass-panel p-4 md:p-6">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                        <h3 class="font-beach text-3xl text-sky-900 drop-shadow-sm">Forecast</h3>
                        
                        <!-- Dynamic Date Tabs Container -->
                        <div id="date-tabs-container" class="flex overflow-x-auto w-full md:w-auto bg-white/40 backdrop-blur-md rounded-full p-1 border-2 border-white/60 shadow-sm no-scrollbar space-x-1">
                            <!-- Tabs injected dynamically -->
                        </div>
                    </div>
                    
                    <!-- Hourly Cards Container -->
                    <div id="hourly-container" class="flex overflow-x-auto gap-3 pb-4 pt-1 snap-x snap-mandatory">
                        <!-- Cards injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // DOM Elements
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchView = document.getElementById('search-view');
        const detailsView = document.getElementById('details-view');
        const backBtn = document.getElementById('back-btn');
        
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const contentState = document.getElementById('content-state');
        const errorMessage = document.getElementById('error-message');

        const dateTabsContainer = document.getElementById('date-tabs-container');
        const hourlyContainer = document.getElementById('hourly-container');
        const toggleFavBtn = document.getElementById('toggle-favorite-btn');
        const favIcon = document.getElementById('fav-icon');

        // State Variables
        let debounceTimer;
        let globalWeather = null;
        let globalMarine = null;
        let currentCityData = null;
        let activeDateString = null; 
        
        // --- 1. LOCAL STORAGE / FAVORITES LOGIC ---
        function getFavorites() {
            return JSON.parse(localStorage.getItem('beachVibesFavorites') || '[]');
        }

        function saveFavorites(favs) {
            localStorage.setItem('beachVibesFavorites', JSON.stringify(favs));
            renderFavoritesHome();
        }

        function toggleFavorite() {
            if (!currentCityData) return;
            let favs = getFavorites();
            const existsIndex = favs.findIndex(f => f.latitude === currentCityData.latitude && f.longitude === currentCityData.longitude);
            
            if (existsIndex > -1) {
                favs.splice(existsIndex, 1); // Remove
                favIcon.classList.remove('fill-rose-500');
            } else {
                favs.push(currentCityData); // Add
                favIcon.classList.add('fill-rose-500');
            }
            saveFavorites(favs);
        }

        function checkIsFavorite(city) {
            const favs = getFavorites();
            const isFav = favs.some(f => f.latitude === city.latitude && f.longitude === city.longitude);
            if (isFav) {
                favIcon.classList.add('fill-rose-500');
            } else {
                favIcon.classList.remove('fill-rose-500');
            }
        }

        function renderFavoritesHome() {
            const container = document.getElementById('favorites-container');
            const section = document.getElementById('favorites-section');
            const favs = getFavorites();
            
            if (favs.length === 0) {
                section.classList.add('hidden');
                return;
            }
            
            section.classList.remove('hidden');
            container.innerHTML = '';
            
            favs.forEach(fav => {
                const btn = document.createElement('button');
                btn.className = 'bg-white/60 hover:bg-white border-2 border-white shadow-sm backdrop-blur-sm rounded-full px-4 py-2 text-sky-900 font-bold transition-all text-sm flex items-center';
                btn.innerHTML = `🌊 ${fav.name} <span class="text-sky-600 text-xs ml-1 font-semibold">${fav.country || ''}</span>`;
                btn.onclick = () => loadCityProfile(fav, true);
                container.appendChild(btn);
            });
        }

        toggleFavBtn.addEventListener('click', toggleFavorite);

        // --- 2. BROWSER HISTORY (BACK BUTTON) LOGIC ---
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.city) {
                loadCityProfile(e.state.city, false); // false = don't push state again
            } else {
                showSearchView();
            }
        });

        function showSearchView() {
            detailsView.classList.add('hidden');
            detailsView.classList.remove('fade-in');
            searchView.classList.remove('hidden');
            searchView.classList.add('fade-in');
            searchInput.value = '';
            searchResults.classList.add('hidden');
            
            document.documentElement.style.setProperty('--wave-speed-1', '7s');
            document.documentElement.style.setProperty('--wave-speed-2', '10s');
            document.documentElement.style.setProperty('--wave-speed-3', '13s');
            document.documentElement.style.setProperty('--wave-speed-4', '20s');
            
            renderFavoritesHome(); // Refresh home favorites
        }

        backBtn.addEventListener('click', () => {
            history.pushState(null, "", window.location.pathname);
            showSearchView();
        });


        // --- 3. SEARCH & FETCH LOGIC ---
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }
            debounceTimer = setTimeout(() => searchCities(query), 500);
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        async function searchCities(query) {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`);
                const data = await res.json();
                if (data.results && data.results.length > 0) renderSearchResults(data.results);
                else {
                    searchResults.innerHTML = `<div class="p-4 text-sky-800 font-bold text-center text-sm">No beaches found. 🏝️</div>`;
                    searchResults.classList.remove('hidden');
                }
            } catch (err) { console.error(err); }
        }

        function renderSearchResults(cities) {
            searchResults.innerHTML = '';
            cities.forEach(city => {
                const div = document.createElement('div');
                div.className = 'px-5 py-3 hover:bg-sky-100 cursor-pointer border-b border-sky-50 last:border-0 flex flex-col transition-colors';
                div.innerHTML = `<span class="font-extrabold text-sky-900 text-lg">${city.name}</span>
                                 <span class="text-xs text-amber-600 font-bold">${city.admin1 ? city.admin1 + ', ' : ''}${city.country}</span>`;
                div.addEventListener('click', () => {
                    searchResults.classList.add('hidden');
                    loadCityProfile(city, true);
                });
                searchResults.appendChild(div);
            });
            searchResults.classList.remove('hidden');
        }

        // --- 4. DETAILS VIEW & API PROCESSING ---
        async function loadCityProfile(city, pushHistory = true) {
            if (pushHistory) {
                history.pushState({ city: city }, "", `?location=${encodeURIComponent(city.name)}`);
            }
            currentCityData = city;
            
            searchView.classList.add('hidden');
            detailsView.classList.remove('hidden');
            detailsView.classList.add('fade-in');
            
            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            contentState.classList.add('hidden');

            document.getElementById('city-name').textContent = city.name;
            document.getElementById('city-country').textContent = city.country || 'Unknown';
            checkIsFavorite(city);

            try {
                // Requested 7 days forecast for more data
                const [weatherData, marineData] = await Promise.all([
                    fetchWeather(city.latitude, city.longitude),
                    fetchMarine(city.latitude, city.longitude)
                ]);

                if (!marineData) {
                    showError("Whoops! This location is too far inland. We need the ocean!");
                    return;
                }
                renderDetails(weatherData, marineData, city);
            } catch (err) {
                showError("The weather buoys aren't responding. Try again later!");
            }
        }

        async function fetchWeather(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m&hourly=temperature_2m,wind_speed_10m&timezone=auto&forecast_days=7`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("Weather API failed");
            return await res.json();
        }

        async function fetchMarine(lat, lon) {
            const getUrl = (l, ln) => `https://marine-api.open-meteo.com/v1/marine?latitude=${l}&longitude=${ln}&hourly=wave_height,sea_surface_temperature&timezone=auto&forecast_days=7`;
            const offsets = [[0, 0], [0.05, 0], [-0.05, 0], [0, 0.05], [0, -0.05], [0.1, 0], [-0.1, 0]];
            for (let [dLat, dLon] of offsets) {
                try {
                    let probeRes = await fetch(getUrl(lat + dLat, lon + dLon));
                    if (probeRes.ok) {
                        const data = await probeRes.json();
                        if (data.hourly && (data.hourly.wave_height || data.hourly.sea_surface_temperature)) return data;
                    }
                } catch (e) {}
            }
            return null;
        }

        function showError(msg) {
            loadingState.classList.add('hidden');
            errorMessage.textContent = msg;
            errorState.classList.remove('hidden');
        }

        function estimateWaterTemp(lat, airTemp) {
            const absLat = Math.abs(lat);
            const radLat = (absLat * Math.PI) / 180;
            let sst = 28 * Math.cos(radLat * 1.25); 
            sst += ((airTemp - sst) * 0.12);
            return Math.max(-1.5, Math.min(30.5, sst));
        }

        function renderDetails(weather, marine, city) {
            loadingState.classList.add('hidden');
            contentState.classList.remove('hidden');
            document.getElementById('forecast-section').classList.remove('hidden');

            globalWeather = weather;
            globalMarine = marine;

            const airTemp = weather.current.temperature_2m;
            const windSpeed = weather.current.wind_speed_10m;
            let waveHeight = 0;
            let realWaterTemp = null;

            if (marine.hourly?.wave_height) waveHeight = marine.hourly.wave_height.find(h => h !== null) || 0;
            if (marine.hourly?.sea_surface_temperature) realWaterTemp = marine.hourly.sea_surface_temperature.find(t => t !== null) || null;
            
            const finalWaterTemp = realWaterTemp !== null ? realWaterTemp : estimateWaterTemp(city.latitude, airTemp);

            document.getElementById('val-water-temp').textContent = `${finalWaterTemp.toFixed(1)}°C`;
            document.getElementById('val-waves').textContent = `${waveHeight.toFixed(1)} m`;
            document.getElementById('val-air-temp').textContent = `${airTemp.toFixed(1)}°C`;
            document.getElementById('val-wind').textContent = `${windSpeed.toFixed(1)} km/h`;

            // Evaluate banner
            evaluateSwimmingConditions(finalWaterTemp, waveHeight, windSpeed);

            // Generate Dynamic Tabs for the next 7 days
            generateForecastTabs();
        }

        // --- 5. DYNAMIC FORECAST & TABS ---
        function generateForecastTabs() {
            dateTabsContainer.innerHTML = '';
            const times = globalWeather.hourly.time;
            
            // Extract unique dates (YYYY-MM-DD)
            const uniqueDates = [...new Set(times.map(t => t.split('T')[0]))];
            
            const todayStr = new Date().toISOString().split('T')[0];
            let dateSelected = false;

            uniqueDates.forEach((dateStr, index) => {
                const dateObj = new Date(dateStr);
                let label = '';
                
                if (index === 0) label = 'Today';
                else if (index === 1) label = 'Tomorrow';
                else {
                    label = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                }

                const btn = document.createElement('button');
                btn.className = 'tab-btn px-4 py-1.5 rounded-full font-bold transition-all text-sm whitespace-nowrap shrink-0 text-sky-700 hover:text-sky-900';
                btn.textContent = label;
                btn.dataset.date = dateStr;
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('bg-white', 'shadow', 'text-sky-900');
                        b.classList.add('text-sky-700');
                    });
                    btn.classList.add('bg-white', 'shadow', 'text-sky-900');
                    btn.classList.remove('text-sky-700');
                    renderHourlyForecastForDate(dateStr);
                });

                dateTabsContainer.appendChild(btn);

                // Auto-click the first tab
                if(!dateSelected) {
                    btn.click();
                    dateSelected = true;
                }
            });
        }

        function renderHourlyForecastForDate(dateString) {
            hourlyContainer.innerHTML = '';
            
            const allTimes = globalWeather.hourly.time;
            // Filter indexes that match the requested date
            const hourIndexes = allTimes.reduce((acc, time, idx) => {
                if (time.startsWith(dateString)) acc.push(idx);
                return acc;
            }, []);

            // If it's today, we might only want from the current hour forward
            const currentHourISO = new Date().toISOString().substring(0,13); 
            
            hourIndexes.forEach(i => {
                const timeRaw = allTimes[i];
                
                // Skip past hours for "Today" to save space
                if (timeRaw.split('T')[0] === new Date().toISOString().split('T')[0] && timeRaw < currentHourISO+":00") {
                    return; 
                }

                const timeStr = timeRaw.split('T')[1];
                const airTemp = globalWeather.hourly.temperature_2m[i];
                const wind = globalWeather.hourly.wind_speed_10m[i];
                
                let wave = 0;
                let waterTemp = estimateWaterTemp(currentCityData.latitude, airTemp);

                if (globalMarine?.hourly) {
                    if (globalMarine.hourly.wave_height[i] !== null) wave = globalMarine.hourly.wave_height[i];
                    if (globalMarine.hourly.sea_surface_temperature[i] !== null) waterTemp = globalMarine.hourly.sea_surface_temperature[i];
                }

                let hourEmoji = '🏖️';
                if (waterTemp < 19 || wave > 1.2 || wind > 25) hourEmoji = '🛑';

                const card = document.createElement('div');
                card.className = 'glass-card min-w-[140px] p-4 flex flex-col items-center text-center snap-center shrink-0 transition-all hover:bg-white/90';
                card.innerHTML = `
                    <p class="font-black text-sky-800 text-md mb-1">${timeStr}</p>
                    <div class="text-3xl mb-3 mt-1 drop-shadow-md">${hourEmoji}</div>
                    
                    <div class="flex flex-col gap-1.5 w-full">
                        <div class="flex justify-between items-center text-xs font-bold text-sky-900 bg-white/60 px-2 py-1 rounded">
                            <span>🌊</span> <span>${wave.toFixed(1)}m</span>
                        </div>
                        <div class="flex justify-between items-center text-xs font-bold text-sky-900 bg-white/60 px-2 py-1 rounded">
                            <span>🌡️</span> <span>${waterTemp.toFixed(1)}°</span>
                        </div>
                        <div class="flex justify-between items-center text-xs font-bold text-sky-900 bg-white/60 px-2 py-1 rounded">
                            <span>💨</span> <span>${wind.toFixed(0)}</span>
                        </div>
                    </div>
                `;
                hourlyContainer.appendChild(card);
            });
        }

        function evaluateSwimmingConditions(waterTemp, waves, wind) {
            const banner = document.getElementById('suitability-banner');
            const title = document.getElementById('suitability-title');
            const reason = document.getElementById('suitability-reason');
            const iconContainer = document.getElementById('suitability-icon');

            let isSuitable = true;
            let reasonsList = [];

            if (waterTemp < 19) { isSuitable = false; reasonsList.push(`Brrr! Cold water (${waterTemp.toFixed(1)}°C).`); }
            if (waves > 1.2) { isSuitable = false; reasonsList.push(`Rough waves (${waves.toFixed(1)}m).`); }
            if (wind > 25) { isSuitable = false; reasonsList.push(`Heavy wind (${wind.toFixed(0)}km/h).`); }

            if (isSuitable) {
                banner.className = "glass-panel p-5 mb-6 flex items-center flex-col sm:flex-row gap-4 border-[3px] border-emerald-400 bg-emerald-50/70";
                title.textContent = "Grab your surfboard!";
                title.className = "font-beach text-3xl mb-1 text-emerald-700";
                reason.textContent = `Perfect beach day! Nice water and gentle waves.`;
                reason.className = "text-emerald-900 text-md font-bold";
                iconContainer.innerHTML = `🏖️`;
            } else {
                banner.className = "glass-panel p-5 mb-6 flex items-center flex-col sm:flex-row gap-4 border-[3px] border-rose-400 bg-rose-50/70";
                title.textContent = "Maybe chill on the sand.";
                title.className = "font-beach text-3xl mb-1 text-rose-700";
                reason.textContent = `${reasonsList.join(" ")}`;
                reason.className = "text-rose-900 text-md font-bold";
                iconContainer.innerHTML = `🛑`;
            }
        }

        // Initialize Favorites on Load
        renderFavoritesHome();
    </script>
</body>
</html>
